    <!-- Modal Structure -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <button class="close" aria-label="Close modal" onClick="closeModal()">
                &times;
            </button>
            <img id="modalImage" src="" alt="Dish">
            <h2 id="modalTitle">Modal Title</h2>
            <p id="modalDescription"></p>
        </div>
    </div>
    <script>
        // Scroll to the Top Button
        let mybutton = document.getElementById("scrollToTopBtn");

        window.onscroll = function () {
            scrollFunction();
        };

        function scrollFunction() {
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                mybutton.style.display = "block";
            } else {
                mybutton.style.display = "none";
            }
        }

        function topFunction() {
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
        }

        function clearSearch() {
            document.getElementById("searchInput").value = '';
            filterMenu();
        }

        function filterMenu() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let menuSections = document.querySelectorAll(".menu-section");

            menuSections.forEach(section => {
                let sectionTitle = section.querySelector("h1"); // Get the section title
                let menuItems = section.querySelectorAll(".menu-item");
                let foundInSection = false;

                menuItems.forEach(item => {
                    let itemName = item.querySelector("h2").innerText.toLowerCase();
                    let itemDescription = item.querySelector("p").innerText.toLowerCase();

                    // Check if either item name or description contains the input
                    if (itemName.includes(input) || itemDescription.includes(input) || sectionTitle.innerText.toLowerCase().includes(input)) {
                        item.style.display = "block";
                        foundInSection = true;
                    } else {
                        item.style.display = "none";
                    }
                });

                // Show or hide the section based on whether items were found
                if (foundInSection) {
                    section.style.display = "flex";
                    sectionTitle.style.display = "block";
                } else {
                    section.style.display = "none";
                    sectionTitle.style.display = "none";
                }
            });
        }
    </script>
